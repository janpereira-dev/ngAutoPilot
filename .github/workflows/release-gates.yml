name: Release Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Set up Python audit runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Audit internal Python dependencies without source builds
        run: |
          python -m pip install --only-binary=:all: pip-audit==2.10.1 PyYAML==6.0.3
          python scripts/audit-python-dependencies.py

      - name: Audit dependencies and bilingual documentation
        run: npm audit --audit-level=high && npm run docs:validate && npm run docs:graphics:check

      - name: Validate skills
        run: npm run skills:validate

      - name: Validate skill frontmatter
        run: npm run skills:validate:frontmatter

      - name: Scan skill content
        run: npm run security:scan

      - name: Validate distribution contract
        run: npm run distribution:validate

      - name: Regenerate catalog
        run: npm run skills:catalog

      - name: Sync plugin bundles
        run: npm run plugins:sync

      - name: Sync Agent Plugins
        run: npm run agent-plugins:sync

      - name: Validate OpenAI public package
        run: npm run openai:validate

      - name: Check generated drift
        run: git diff --exit-code -- catalog.json plugins agent-plugins .agents/plugins/marketplace.json .claude-plugin/marketplace.json

      - name: Verify npx skills discovery and real installation
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          npm run npx-skills:validate
          npm exec --yes --package=skills@1.7.4 -- skills add . --list > "$RUNNER_TEMP/ngautopilot-npx-list.txt"
          node scripts/verify-npx-discovery.mjs "$RUNNER_TEMP/ngautopilot-npx-list.txt"
          mkdir -p "$RUNNER_TEMP/npx-install-receiver"
          cd "$RUNNER_TEMP/npx-install-receiver"
          npm exec --yes --package=skills@1.7.4 -- skills add "$GITHUB_WORKSPACE" --skill ngautopilot-angular-13-15 -a codex --copy -y
          test -f ".agents/skills/ngautopilot-angular-13-15/references/skills/angular--upgrade--hops--angular-14-to-15/procedure.md"

      - name: Validate Agent Plugins
        run: npm run agent-plugins:validate && npm run agent-plugins:smoke

      - name: Validate consistency
        run: npm run consistency:validate

      - name: Validate marketplaces
        run: npm run marketplaces:validate

      - name: Check release version and tests
        run: npm run release:check-version && npm run test:scripts && npm test

      - name: Dry-run package
        run: npm run pack:dry

      - name: Validate actual npm member inventory and archive integrity
        run: npm run release:inventory
