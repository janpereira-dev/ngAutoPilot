name: Publish Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skills
        run: npm run skills:validate

      - name: Regenerate catalog
        run: npm run skills:catalog

      - name: Build publish bundles
        run: npm run skills:publish:pack

      - name: Upload publish bundles
        uses: actions/upload-artifact@v4
        with:
          name: ngautopilot-publish-bundles
          path: dist/publish
          if-no-files-found: error
