name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm and create release artifacts
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skills
        run: npm run skills:validate

      - name: Regenerate catalog
        run: npm run skills:catalog

      - name: Check catalog drift
        run: git diff --exit-code -- catalog.json

      - name: Build publish bundles
        run: npm run skills:publish:pack

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/publish/**/*
