roke-linejoin="round" aria-hidden="true"><circle cx="20" cy="20" r="14"/><path d="m31 31 13 13M13 20h14m-7-7v14"/></g><text x="910" y="311" fill="#172b42" font-size="25" font-weight="700" ><tspan x="910" dy="0">Compare</tspan></text><text x="910" y="351" fill="#2855a0" font-size="21" font-weight="600" ><tspan x="910" dy="0">consistency:validate</tspan></text><rect x="40" y="415" width="1120" height="121" rx="20" fill="#fae3d9" stroke="#b8402d" stroke-width="2"/><g transform="translate(59 441) scale(1)" fill="none" stroke="#b8402d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="20" cy="20" r="14"/><path d="m31 31 13 13M13 20h14m-7-7v14"/></g><text x="130" y="456" fill="#172b42" font-size="24" font-weight="700" ><tspan x="130" dy="0">Before publishing: review the generated diff + full release checklist.</tspan></text><text x="130" y="496" fill="#46576a" font-size="21" font-weight="400" ><tspan x="130" dy="0">These steps can write generated files. Passing them is not external approval.</tspan></text>
