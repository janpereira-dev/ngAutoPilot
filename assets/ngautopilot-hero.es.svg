<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" xml:lang="es">
<title id="title">Un plan de vuelo para tu próxima tarea</title>
<desc id="desc">Del catálogo reutilizable a las guías que realmente necesita tu proyecto. No es una librería de ejecución ni un migrador automático. La persona mantiene el control.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#172b42"/></marker>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#172b42" opacity=".08"/></pattern>
<style>text{font-family:"Segoe UI",Arial,sans-serif} </style></defs>
<rect x="0" y="0" width="1200" height="640" rx="28" fill="#f7f4ed" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1200" height="575" fill="url(#dots)" rx="28"/>
<rect x="36" y="28" width="74" height="30" rx="15" fill="#172b42" stroke="none" stroke-width="2"/><text x="73" y="49" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle"><tspan x="73" dy="0">HOLA</tspan></text>
<text x="125" y="49" fill="#46576a" font-size="15" font-weight="700" ><tspan x="125" dy="0">NgAutoPilot / GUÍA DE CAMPO</tspan></text>
<text x="36" y="104" fill="#172b42" font-size="36" font-weight="750" ><tspan x="36" dy="0">Un plan de vuelo para tu próxima tarea</tspan></text><text x="36" y="141" fill="#46576a" font-size="20" font-weight="400" ><tspan x="36" dy="0">Del catálogo reutilizable a las guías que realmente necesita tu proyecto.</tspan></text>
<text x="40" y="220" fill="#172b42" font-size="53" font-weight="750" ><tspan x="40" dy="0">NgAutoPilot</tspan><tspan x="40" dy="72">Menos ruido.</tspan><tspan x="40" dy="72">Más dirección.</tspan></text><text x="42" y="421" fill="#46576a" font-size="24" font-weight="500" ><tspan x="42" dy="0">Guías breves. Decisiones claras.</tspan></text><rect x="40" y="465" width="414" height="55" rx="20" fill="#d7ebe6" stroke="none" stroke-width="2"/><g transform="translate(54 478) scale(0.6)" fill="none" stroke="#056f65" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="m31 17-4 14-10-10 14-4Z"/><path d="M24 0v4m0 40v4M0 24h4m40 0h4"/></g><text x="95" y="499" fill="#056f65" font-size="21" font-weight="650" ><tspan x="95" dy="0">Tú diriges. Tu agente te acompaña.</tspan></text><rect x="586" y="180" width="187" height="191" rx="16" fill="#e4dcef" stroke="#6445a2" stroke-width="2"/><rect x="571" y="190" width="187" height="191" rx="16" fill="#eee8f5" stroke="#6445a2" stroke-width="2"/><rect x="556" y="200" width="187" height="191" rx="16" fill="#ffffff" stroke="#6445a2" stroke-width="2"/><g transform="translate(620 222) scale(1)" fill="none" stroke="#6445a2" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 14 21-10 21 10-21 10L3 14Zm0 10 21 10 21-10M3 34l21 10 21-10"/></g><text x="579" y="297" fill="#172b42" font-size="25" font-weight="700" ><tspan x="579" dy="0">El catálogo</tspan></text><text x="579" y="331" fill="#46576a" font-size="18" font-weight="400" ><tspan x="579" dy="0">Guías reutilizables</tspan></text><text x="579" y="365" fill="#6445a2" font-size="19" font-weight="600" ><tspan x="579" dy="0">skills/</tspan></text><path d="M760 291H817" fill="none" stroke="#172b42" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="831" y="210" width="324" height="153" rx="22" fill="#ffffff" stroke="#b8402d" stroke-width="2"/><g transform="translate(850 231) scale(0.75)" fill="none" stroke="#b8402d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="m31 17-4 14-10-10 14-4Z"/><path d="M24 0v4m0 40v4M0 24h4m40 0h4"/></g><text x="905" y="254" fill="#172b42" font-size="25" font-weight="700" ><tspan x="905" dy="0">Un pack útil</tspan></text><text x="852" y="306" fill="#46576a" font-size="21" font-weight="400" ><tspan x="852" dy="0">Elige según la tarea,</tspan></text><text x="852" y="334" fill="#46576a" font-size="21" font-weight="400" ><tspan x="852" dy="0">no por todas las posibilidades.</tspan></text><path d="M993 365H993V404" fill="none" stroke="#172b42" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="554" y="415" width="601" height="132" rx="20" fill="#172b42" stroke="none" stroke-width="2"/><g transform="translate(575 433) scale(0.85)" fill="none" stroke="#91ddd0" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="44" height="36" rx="7"/><path d="m10 17 9 7-9 7m17 0h10"/></g><text x="637" y="459" fill="#ffffff" font-size="27" font-weight="700" ><tspan x="637" dy="0">Tu proyecto + tu agente</tspan></text><text x="577" y="500" fill="#e8e5f3" font-size="23" font-weight="500" ><tspan x="577" dy="0">Cambio acotado → pruebas → evidencia</tspan></text><text x="577" y="529" fill="#e8e5f3" font-size="18" font-weight="400" ><tspan x="577" dy="0">Las guías no se ejecutan solas.</tspan></text>
<rect x="20" y="575" width="1160" height="45" rx="15" fill="#172b42" stroke="none" stroke-width="2"/><text x="42" y="605" fill="#ffffff" font-size="19" font-weight="600" ><tspan x="42" dy="0">No es una librería de ejecución ni un migrador automático. La persona mantiene el control.</tspan></text>
</svg>
