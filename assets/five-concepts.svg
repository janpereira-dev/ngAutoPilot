<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Five concepts, one connected system</title>
<desc id="desc">The pack selects; the adapter places; the host still has to discover the guidance. Installing Markdown does not deploy, register MCP, grant permissions or start subagents.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#172b42"/></marker>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#172b42" opacity=".08"/></pattern>
<style>text{font-family:"Segoe UI",Arial,sans-serif} </style></defs>
<rect x="0" y="0" width="1200" height="675" rx="28" fill="#f7f4ed" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1200" height="610" fill="url(#dots)" rx="28"/>
<rect x="36" y="28" width="74" height="30" rx="15" fill="#172b42" stroke="none" stroke-width="2"/><text x="73" y="49" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle"><tspan x="73" dy="0">03</tspan></text>
<text x="125" y="49" fill="#46576a" font-size="15" font-weight="700" ><tspan x="125" dy="0">NgAutoPilot / FIELD GUIDE</tspan></text>
<text x="36" y="104" fill="#172b42" font-size="36" font-weight="750" ><tspan x="36" dy="0">Five concepts, one connected system</tspan></text><text x="36" y="141" fill="#46576a" font-size="20" font-weight="400" ><tspan x="36" dy="0">The pack selects; the adapter places; the host still has to discover the guidance.</tspan></text>
<rect x="40" y="187" width="525" height="256" rx="20" fill="#eee8f5" stroke="#6445a2" stroke-width="2"/><g transform="translate(60 205) scale(0.7)" fill="none" stroke="#6445a2" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 14 21-10 21 10-21 10L3 14Zm0 10 21 10 21-10M3 34l21 10 21-10"/></g><text x="108" y="233" fill="#172b42" font-size="29" font-weight="700" ><tspan x="108" dy="0">2 / Pack</tspan></text><text x="60" y="271" fill="#46576a" font-size="22" font-weight="400" ><tspan x="60" dy="0">A selection for a job</tspan></text><rect x="61" y="298" width="232" height="123" rx="13" fill="#ffffff" stroke="#6445a2" stroke-width="2"/><text x="80" y="331" fill="#172b42" font-size="26" font-weight="700" ><tspan x="80" dy="0">1 / Skill</tspan></text><text x="80" y="365" fill="#172b42" font-size="21" font-weight="400" ><tspan x="80" dy="0">One problem,</tspan></text><text x="80" y="393" fill="#172b42" font-size="21" font-weight="400" ><tspan x="80" dy="0">one procedure</tspan></text><rect x="308" y="298" width="235" height="123" rx="13" fill="#ffffff" stroke="#6445a2" stroke-width="2"/><text x="325" y="329" fill="#172b42" font-size="26" font-weight="700" ><tspan x="325" dy="0">4 / Role</tspan></text><text x="325" y="364" fill="#172b42" font-size="20" font-weight="400" ><tspan x="325" dy="0">Optional specialist</tspan></text><text x="325" y="393" fill="#172b42" font-size="20" font-weight="400" ><tspan x="325" dy="0">Markdown ≠ process</tspan></text><path d="M569 305H615" fill="none" stroke="#172b42" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="631" y="223" width="242" height="190" rx="20" fill="#d7ebe6" stroke="#056f65" stroke-width="2"/><g transform="translate(655 242) scale(0.7)" fill="none" stroke="#056f65" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="5"/><circle cx="39" cy="7" r="5"/><circle cx="9" cy="41" r="5"/><path d="M9 12v24m30-24v6c0 10-30 8-30 17"/></g><text x="653" y="312" fill="#172b42" font-size="28" font-weight="700" ><tspan x="653" dy="0">3 / Adapter</tspan></text><text x="653" y="348" fill="#172b42" font-size="21" font-weight="400" ><tspan x="653" dy="0">Maps files to</tspan></text><text x="653" y="376" fill="#172b42" font-size="21" font-weight="400" ><tspan x="653" dy="0">the host layout</tspan></text><path d="M880 305H921" fill="none" stroke="#172b42" stroke-width="2.5" marker-end="url(#arrow)"/><g transform="translate(991 249) scale(1.3)" fill="none" stroke="#2855a0" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="44" height="36" rx="7"/><path d="m10 17 9 7-9 7m17 0h10"/></g><text x="942" y="353" fill="#172b42" font-size="28" font-weight="700" ><tspan x="942" dy="0">Your agent</tspan></text><text x="942" y="387" fill="#46576a" font-size="21" font-weight="400" ><tspan x="942" dy="0">Find + invoke</tspan></text><rect x="40" y="474" width="1120" height="109" rx="20" fill="#fae3d9" stroke="#b8402d" stroke-width="2"/><g transform="translate(58 493) scale(1)" fill="none" stroke="#b8402d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 3 43 11v13c0 11-19 21-19 21S5 35 5 24V11L24 3Z"/><path d="m14 23 7 7 13-14"/></g><text x="124" y="512" fill="#172b42" font-size="28" font-weight="700" ><tspan x="124" dy="0">5 / Guardrail</tspan></text><text x="375" y="512" fill="#172b42" font-size="25" font-weight="650" ><tspan x="375" dy="0">A rule for reviewing the work</tspan></text><text x="124" y="549" fill="#46576a" font-size="21" font-weight="400" ><tspan x="124" dy="0">Requires evidence or mitigation. Not a permission system or runtime enforcement.</tspan></text>
<rect x="20" y="610" width="1160" height="45" rx="15" fill="#172b42" stroke="none" stroke-width="2"/><text x="42" y="640" fill="#ffffff" font-size="19" font-weight="600" ><tspan x="42" dy="0">Installing Markdown does not deploy, register MCP, grant permissions or start subagents.</tspan></text>
</svg>
