name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '27 6 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - agent-plugins/ngautopilot-tools/data
          - skill-lab/security-runtime
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Audit the committed lockfile
        if: matrix.directory != '.' || github.event_name == 'schedule'
        working-directory: ${{ matrix.directory }}
        run: npm audit --include=dev --audit-level=low --registry=https://registry.npmjs.org

  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies from the public npm registry
        run: npm audit --include=dev --audit-level=low --registry=https://registry.npmjs.org

      - name: Validate skill frontmatter
        run: npm run skills:validate:frontmatter

      - name: Scan skill content
        run: npm run security:scan

      - name: Validate distribution contract
        run: npm run distribution:validate

      - name: Validate Markdown-only public skill bundles
        run: npm run npx-skills:validate

      - name: Regenerate catalog
        run: npm run skills:catalog

      - name: Sync plugin bundles
        run: npm run plugins:sync

      - name: Validate OpenAI public package
        run: npm run openai:validate

      - name: Check generated drift
        run: git diff --exit-code -- catalog.json plugins .agents/plugins/marketplace.json .claude-plugin/marketplace.json

      - name: Build publish bundles
        run: npm run skills:publish:pack

      - name: Validate publish bundles
        run: npm run publish:validate
