name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate catalog
        run: npm run skills:catalog

      - name: Check catalog drift
        run: git diff --exit-code -- catalog.json

      - name: Build publish bundles
        run: npm run skills:publish:pack

      - name: Validate publish bundles
        run: npm run publish:validate
