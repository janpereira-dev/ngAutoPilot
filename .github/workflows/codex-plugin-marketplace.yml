name: Codex Plugin Marketplace

on:
  pull_request:
    paths:
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - "plugins/**"
      - "catalog.json"
      - "scripts/**"
      - ".github/workflows/codex-plugin-marketplace.yml"
  push:
    branches:
      - main
    paths:
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - "plugins/**"
      - "catalog.json"
      - "scripts/**"
      - ".github/workflows/codex-plugin-marketplace.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate marketplace JSON
        run: |
          python -m json.tool .agents/plugins/marketplace.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
          for manifest in plugins/*/.codex-plugin/plugin.json; do python -m json.tool "$manifest" > /dev/null; done

      - name: Validate required files
        run: |
          test -f .agents/plugins/marketplace.json
          test -f .claude-plugin/marketplace.json
          for manifest in plugins/*/.codex-plugin/plugin.json; do
            plugin_dir="$(dirname "$(dirname "$manifest")")"
            test -d "$plugin_dir/skills"
            find "$plugin_dir/skills" -name SKILL.md -type f | grep -q .
          done

      - name: Sync generated plugin bundles
        run: npm run plugins:sync

      - name: Validate marketplace consistency
        run: npm run distribution:validate && npm run consistency:validate
