<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 625" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Maintain the sources, regenerate the deliveries</title>
<desc id="desc">Run each command with npm run. This is the catalog-maintenance route, not app usage. Local validation → reviewed changes → separate release process. Never imply automatic publication.</desc>
