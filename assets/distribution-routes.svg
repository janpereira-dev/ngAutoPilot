<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 765" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Same catalog. Different delivery contracts.</title>
<desc id="desc">Choose the integration you need; confirm support and behavior in that host. Local stdio MCP ≠ a ChatGPT web connector. The OpenAI packet is not submitted or verified.</desc>
