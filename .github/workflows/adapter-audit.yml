name: Quarterly Adapter Review
on:
  schedule:
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  adapter-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Create source-backed review checklist
        run: node scripts/audit-adapters.mjs > adapter-review.md
      - name: Open tracking issue unless an audit is already open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh issue list --state open --search '"Quarterly adapter documentation review" in:title' --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "Quarterly adapter documentation review" --body-file adapter-review.md
          fi
