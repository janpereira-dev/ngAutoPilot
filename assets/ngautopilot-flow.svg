<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#172b42" opacity=".08"/></pattern>
<style>text{font-family:"Segoe UI",Arial,sans-serif} </style></defs>
<rect x="0" y="0" width="1200" height="625" rx="28" fill="#f7f4ed" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1200" height="560" fill="url(#dots)" rx="28"/>
<rect x="36" y="28" width="74" height="30" rx="15" fill="#172b42" stroke="none" stroke-width="2"/><text x="73" y="49" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle"><tspan x="73" dy="0">08</tspan></text>
<text x="125" y="49" fill="#46576a" font-size="15" font-weight="700" ><tspan x="125" dy="0">NgAutoPilot / FIELD GUIDE</tspan></text>
<text x="36" y="104" fill="#172b42" font-size="36" font-weight="750" ><tspan x="36" dy="0">Maintain the sources, regenerate the deliveries</tspan></text><text x="36" y="141" fill="#46576a" font-size="20" font-weight="400" ><tspan x="36" dy="0">Run each command with npm run. This is the catalog-maintenance route, not app usage.</tspan></text>
