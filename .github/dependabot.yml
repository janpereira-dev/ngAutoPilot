version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/client"
          - "@modelcontextprotocol/server"
        update-types:
          - minor
          - patch
