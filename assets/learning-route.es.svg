<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 555" role="img" aria-labelledby="title desc" xml:lang="es">
<title id="title">Una tarea. Una ruta visible. Evidencia real.</title>
<desc id="desc">Un ritmo de trabajo repetible, no una secuencia de ejecución autónoma. El indicador decorativo recorre la ruta una vez en 3,6 s; el movimiento reducido lo desactiva.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#172b42"/></marker>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#172b42" opacity=".08"/></pattern>
<style>text{font-family:"Segoe UI",Arial,sans-serif} .traveler{opacity:0}@media (prefers-reduced-motion: no-preference){.traveler{animation:travel 3.6s ease-in-out 1}}@keyframes travel{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(880px);opacity:0}}</style></defs>
<rect x="0" y="0" width="1200" height="555" rx="28" fill="#f7f4ed" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1200" height="490" fill="url(#dots)" rx="28"/>
