<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">NgAutoPilot hero banner</title>
  <desc id="desc">Central autopilot hub with surrounding agent skill nodes for Angular, TypeScript, JavaScript, quality, Git, and Sage review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 0.15  0 1 0 0 0.15  0 0 1 0 0.2  0 0 0 0.8 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { font: 600 30px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; letter-spacing: 0.4px; }
      .sub { font: 400 15px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .node { fill: rgba(15,23,42,0.9); stroke: url(#accent); stroke-width: 2; }
      .line { stroke: rgba(148,163,184,0.32); stroke-width: 3; }
      .icon { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #e2e8f0; }
      .pill { rx: 18; ry: 18; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="600" cy="210" r="150" fill="#1d4ed8" opacity="0.16" filter="url(#glow)"/>
  <circle cx="600" cy="210" r="80" fill="#7c3aed" opacity="0.18" filter="url(#glow)"/>

  <g opacity="0.85">
    <path class="line" d="M600 210 L305 110"/>
    <path class="line" d="M600 210 L920 112"/>
    <path class="line" d="M600 210 L985 228"/>
    <path class="line" d="M600 210 L885 330"/>
    <path class="line" d="M600 210 L315 320"/>
    <path class="line" d="M600 210 L220 220"/>
    <path class="line" d="M600 210 L600 62"/>
  </g>

  <g transform="translate(0 0)">
    <rect x="470" y="142" width="260" height="136" rx="28" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <text x="600" y="185" text-anchor="middle" class="label">NgAutoPilot</text>
    <text x="600" y="216" text-anchor="middle" class="sub">Core routing • skills • validation • publish</text>
    <text x="600" y="245" text-anchor="middle" class="sub">Agent-agnostic frontend autopilot</text>
  </g>

  <g>
    <rect x="208" y="76" width="194" height="70" class="node pill"/>
    <text x="305" y="108" text-anchor="middle" class="icon">🧠 Core</text>
    <text x="305" y="129" text-anchor="middle" class="sub">Detect • route • guard</text>
  </g>
  <g>
    <rect x="822" y="78" width="200" height="70" class="node pill"/>
    <text x="922" y="108" text-anchor="middle" class="icon">🏗️ Angular</text>
    <text x="922" y="129" text-anchor="middle" class="sub">Architecture • DI • RxJS</text>
  </g>
  <g>
    <rect x="945" y="193" width="176" height="70" class="node pill"/>
    <text x="1033" y="224" text-anchor="middle" class="icon">🧪 Quality</text>
    <text x="1033" y="245" text-anchor="middle" class="sub">Tests • lint • review</text>
  </g>
  <g>
    <rect x="838" y="300" width="192" height="70" class="node pill"/>
    <text x="934" y="331" text-anchor="middle" class="icon">🚀 Sage</text>
    <text x="934" y="352" text-anchor="middle" class="sub">Review packet • safety layer</text>
  </g>
  <g>
    <rect x="212" y="292" width="190" height="70" class="node pill"/>
    <text x="307" y="322" text-anchor="middle" class="icon">🧾 Git</text>
    <text x="307" y="343" text-anchor="middle" class="sub">PRs • release • changelog</text>
  </g>
  <g>
    <rect x="72" y="193" width="162" height="70" class="node pill"/>
    <text x="153" y="224" text-anchor="middle" class="icon">⚙️ TS/JS</text>
    <text x="153" y="245" text-anchor="middle" class="sub">Types • async • purity</text>
  </g>
  <g>
    <rect x="540" y="24" width="120" height="56" class="node pill"/>
    <text x="600" y="48" text-anchor="middle" class="icon">🧭</text>
    <text x="600" y="67" text-anchor="middle" class="sub">Routes</text>
  </g>
</svg>
