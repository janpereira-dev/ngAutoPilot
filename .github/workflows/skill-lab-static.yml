name: Skill Lab Static

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-skill-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python validation dependencies
        run: python -m pip install "pyyaml>=6.0,<7"

      - name: Install Skill Lab Python bridge
        run: python -m pip install -e skill-lab/python

      - name: Validate Skill Lab structure
        run: npm run skill-lab:validate

      - name: Run Skill Lab tests
        run: npm run skill-lab:test

      - name: Run release validation
        run: npm run release:validate
