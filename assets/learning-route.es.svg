<text x="125" y="49" fill="#46576a" font-size="15" font-weight="700" ><tspan x="125" dy="0">NgAutoPilot / GUÍA DE CAMPO</tspan></text>
<text x="36" y="104" fill="#172b42" font-size="36" font-weight="750" ><tspan x="36" dy="0">Una tarea. Una ruta visible. Evidencia real.</tspan></text><text x="36" y="141" fill="#46576a" font-size="20" font-weight="400" ><tspan x="36" dy="0">Un ritmo de trabajo repetible, no una secuencia de ejecución autónoma.</tspan></text>
