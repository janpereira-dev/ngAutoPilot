name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skills
        run: npm run skills:validate

      - name: Regenerate catalog
        run: npm run skills:catalog

      - name: Build publish bundles
        run: npm run skills:publish:pack

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/publish/**/*
