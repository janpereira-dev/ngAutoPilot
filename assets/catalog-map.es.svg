<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc" xml:lang="es">
<title id="title">Un catálogo fuente, varias rutas de distribución</title>
<desc id="desc">Este mapa muestra dependencias; no afirma que cada host haya ejecutado el paquete. No edites a mano las copias generadas. Cantidades y capacidades dependen de la versión.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#172b42"/></marker>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#172b42" opacity=".08"/></pattern>
<style>text{font-family:"Segoe UI",Arial,sans-serif} </style></defs>
<rect x="0" y="0" width="1200" height="630" rx="28" fill="#f7f4ed" stroke="none" stroke-width="2"/>
<rect x="0" y="0" width="1200" height="565" fill="url(#dots)" rx="28"/>
<rect x="36" y="28" width="74" height="30" rx="15" fill="#172b42" stroke="none" stroke-width="2"/><text x="73" y="49" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle"><tspan x="73" dy="0">05</tspan></text>
<text x="125" y="49" fill="#46576a" font-size="15" font-weight="700" ><tspan x="125" dy="0">NgAutoPilot / GUÍA DE CAMPO</tspan></text>
<text x="36" y="104" fill="#172b42" font-size="36" font-weight="750" ><tspan x="36" dy="0">Un catálogo fuente, varias rutas de distribución</tspan></text><text x="36" y="141" fill="#46576a" font-size="20" font-weight="400" ><tspan x="36" dy="0">Este mapa muestra dependencias; no afirma que cada host haya ejecutado el paquete.</tspan></text>
<rect x="40" y="205" width="352" height="275" rx="20" fill="#eee8f5" stroke="#6445a2" stroke-width="2"/><g transform="translate(62 227) scale(1)" fill="none" stroke="#6445a2" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 14 21-10 21 10-21 10L3 14Zm0 10 21 10 21-10M3 34l21 10 21-10"/></g><text x="124" y="256" fill="#172b42" font-size="26" font-weight="700" ><tspan x="124" dy="0">Fuentes canónicas</tspan></text><text x="64" y="315" fill="#6445a2" font-size="23" font-weight="650" ><tspan x="64" dy="0">skills/</tspan><tspan x="64" dy="32">packs/</tspan><tspan x="64" dy="32">adapters/</tspan><tspan x="64" dy="32">agents/ngautopilot/</tspan></text><text x="64" y="453" fill="#172b42" font-size="21" font-weight="500" ><tspan x="64" dy="0">Edita aquí y regenera.</tspan></text><path d="M397 340H456M456 243V437M456 243H510M456 340H510M456 437H510" fill="none" stroke="#172b42" stroke-width="2.5"/><rect x="510" y="199" width="650" height="84" rx="13" fill="#ffffff" stroke="#2855a0" stroke-width="2"/><text x="532" y="230" fill="#2855a0" font-size="26" font-weight="700" ><tspan x="532" dy="0">catalog.json</tspan></text><text x="532" y="265" fill="#46576a" font-size="21" font-weight="400" ><tspan x="532" dy="0">Índice del catálogo de skills</tspan></text><rect x="510" y="296" width="650" height="84" rx="13" fill="#ffffff" stroke="#056f65" stroke-width="2"/><text x="532" y="327" fill="#056f65" font-size="26" font-weight="700" ><tspan x="532" dy="0">plugins/</tspan></text><text x="532" y="362" fill="#46576a" font-size="21" font-weight="400" ><tspan x="532" dy="0">Bundles nativos y manifiestos</tspan></text><rect x="510" y="393" width="650" height="84" rx="13" fill="#ffffff" stroke="#b8402d" stroke-width="2"/><text x="532" y="424" fill="#b8402d" font-size="26" font-weight="700" ><tspan x="532" dy="0">agent-plugins/</tspan></text><text x="532" y="459" fill="#46576a" font-size="21" font-weight="400" ><tspan x="532" dy="0">Paquetes de distribución portables</tspan></text><text x="42" y="541" fill="#172b42" font-size="25" font-weight="650" ><tspan x="42" dy="0">Valida las fuentes → regenera las copias → comprueba coherencia.</tspan></text>
<rect x="20" y="565" width="1160" height="45" rx="15" fill="#172b42" stroke="none" stroke-width="2"/><text x="42" y="595" fill="#ffffff" font-size="19" font-weight="600" ><tspan x="42" dy="0">No edites a mano las copias generadas. Cantidades y capacidades dependen de la versión.</tspan></text>
