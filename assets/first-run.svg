ranslate(626 259) scale(0.85)" fill="none" stroke="#b8402d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 26 11 11L43 11"/><path d="M23 4H5v40h36V28"/></g><text x="620" y="342" fill="#172b42" font-size="26" font-weight="700" ><tspan x="620" dy="0">Approve</tspan></text><text x="620" y="380" fill="#2855a0" font-size="22" font-weight="650" ><tspan x="620" dy="0">--yes</tspan></text><text x="620" y="417" fill="#46576a" font-size="20" font-weight="400" ><tspan x="620" dy="0">Only after review</tspan></text><circle cx="936" cy="212" r="25" fill="#056f65"/><text x="936" y="220" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle"><tspan x="936" dy="0">4</tspan></text><g transform="translate(916 259) scale(0.85)" fill="none" stroke="#056f65" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 3 43 11v13c0 11-19 21-19 21S5 35 5 24V11L24 3Z"/><path d="m14 23 7 7 13-14"/></g><text x="910" y="342" fill="#172b42" font-size="26" font-weight="700" ><tspan x="910" dy="0">Verify files</tspan></text><text x="910" y="380" fill="#2855a0" font-size="22" font-weight="650" ><tspan x="910" dy="0">verify</tspan></text><text x="910" y="417" fill="#46576a" font-size="20" font-weight="400" ><tspan x="910" dy="0">Manifest + checksums</tspan></text><rect x="40" y="475" width="1120" height="109" rx="20" fill="#d7ebe6" stroke="#056f65" stroke-width="2"/><g transform="translate(60 494) scale(1)" fill="none" stroke="#056f65" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="44" height="36" rx="7"/><path d="m10 17 9 7-9 7m17 0h10"/></g><text x="126" y="510" fill="#172b42" font-size="24" font-weight="700" ><tspan x="126" dy="0">Last checkpoint: ask your agent to name the installed skill.</tspan></text><text x="126" y="546" fill="#46576a" font-size="21" font-weight="400" ><tspan x="126" dy="0">A file check is not proof that the host discovers or invokes it.</tspan></text>
